[project]
name = "batoiller"
version = "0.0.1"
description = "Local-first AI language tutor — converse with a local LLM that teaches you a language."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Régis", email = "regis@lonco.ch" },
]
keywords = ["language-learning", "llm", "ollama", "tutor", "local-first", "cefr"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "ollama>=0.6,<0.7",
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  # Audio stack (brick 2+). mlx-whisper is Apple-Silicon only.
  "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sounddevice>=0.5.5",
  "soundfile>=0.13.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batoiller"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mlx_whisper.*", "sounddevice.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
